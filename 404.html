<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 | Page Not Found</title>
  <meta name="robots" content="noindex" />
  <style>
    body{
      margin:0; min-height:100vh; display:grid; place-items:center;
      font-family: "Pretendard","Noto Sans KR","Segoe UI",sans-serif;
      color:#f4f7fb;
      background: linear-gradient(180deg,#4f89b7 0%,#23364f 55%,#111b2b 100%);
    }
    .box{ text-align:center; padding:24px; }
    h1{ font-size:42px; margin-bottom:10px; letter-spacing:.04em; }
    p{ opacity:.92; margin-bottom:18px; }
    a{
      display:inline-block; padding:10px 14px; border:1px solid rgba(255,255,255,.5);
      color:#fff; text-decoration:none; border-radius:8px;
    }
    a:hover{ background:rgba(255,255,255,.12); }
  </style>
</head>
<body>
  <div class="box">
    <h1>404</h1>
    <p>페이지를 찾을 수 없습니다.</p>
    <a href="/myhome/">홈으로 이동</a>
  </div>
</body>
</html>
